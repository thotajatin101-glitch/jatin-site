<!doctype html>
<meta charset="utf-8">
<title>JATIN studio</title>
<!-- Dev-only still renderer for posts and reel frames. Never ships. three.js r128 from cdnjs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,500;0,600;0,700;1,700&family=VT323&family=Permanent+Marker&display=swap">
<style>
@font-face{font-family:"Sterion";src:url(../fonts/SterionItalic-R99PA.ttf) format("truetype")}
@font-face{font-family:"Cyberway Riders";src:url(../../../CyberwayRiders-lg97d.ttf) format("truetype")}
html,body{margin:0;background:#111}
canvas{display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<body>
<script>
const Q=new URLSearchParams(location.search);
const DRAFT=Q.get('d')||'p1';
const PAL={acid:'#e8ff00',cyan:'#00f0d8',pink:'#ff2e88',mag:'#c81ee0',purple:'#7a12b0',green:'#39e639',chrome:'#c3cadf',ink:'#000000',paper:'#ffffff'};
const RAMP={
  cyan:['#00262a','#006f73','#00f0d8','#7ffcef','#e9fffc'],
  pink:['#3a0a52','#9a1460','#ff2e88','#ff8cc0','#fff0f7'],
  acid:['#1a3d00','#39e639','#e8ff00','#f4ff8a','#fdffe0'],
  mag:['#2a0640','#7a12b0','#c81ee0','#e48cf2','#fbeefe'],
  chrome:['#0b0c10','#4a5068','#c3cadf','#eef1fa','#ffffff'],
  ink:['#000000','#07070a','#101118','#1d1f29','#2c2f3c']
};
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay=(i,j)=>(B4[(j&3)*4+(i&3)]+.5)/16;
const hash=(a,b=0)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const loadImg=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('img '+src));i.src=src});
const W=root=>root;

// ============================================================ TYPE
// Cyberway, hand-sticker treatment: acid fill printed with dots and a dithered green foot,
// thick rough pink marker outline, hard ink drop. Every glyph jostled like hand lettering.
function dotTile(px,alpha){const c=mk(px,px),x=c.getContext('2d');x.fillStyle=`rgba(0,0,0,${alpha})`;x.beginPath();x.arc(px/2,px/2,px*.28,0,7);x.fill();return c}
function dotPattern(ctx,px,alpha,ang=23){const p=ctx.createPattern(dotTile(px,alpha),'repeat');p.setTransform(new DOMMatrix().rotate(ang));return p}
function glyphRun(text,font,size,track){
  const c=mk(8,8).getContext('2d');c.font=font.startsWith('italic')?font.replace('italic 700 ',`italic 700 ${size}px `):/^\d00 /.test(font)?font.replace(/^(\d00) /,`$1 ${size}px `):`${size}px ${font}`;let x=0;const g=[];
  for(const ch of text){const w=c.measureText(ch).width;g.push({ch,x,w});x+=w+track*size}
  return{g,w:x-track*size};
}
// The site's silver plate (ABOUT's name tag and copy plate, round 5 of the posts, his ask): paper dithered into the
// silver ramp (white -> lavender grey, DitherFX's light-shape ramp) in 3px Bayer cells, skewed, an ink rule, a hard
// ink drop, and ink type in Plex Mono italic 700, fattened with an ink stroke so it reads bold.
// Round 6 (his note: the bold "doe'snt look", use the WHO I AM font): the type is #wedgeSub's exactly: Plex Mono 600,
// upright, uppercase, tracked .42em, slanted only by the plate's own skew (-9deg). No faux-bold stroke.
function silverPlate(O,text,cx,cy,size,rot,cw){
  text=text.toUpperCase();
  const font=`600 ${size}px "IBM Plex Mono"`,run=glyphRun(text,'600 "IBM Plex Mono"',size,.42);
  const padX=size*1.1,padY=size*.42,w=run.w+padX*2,h=size*.82+padY*2,cell=Math.max(3,Math.round(cw/360)),sk=Math.tan(-9*Math.PI/180);
  const lw=Math.ceil(w/cell),lh=Math.ceil(h/cell),dc=mk(lw,lh),dx=dc.getContext('2d'),im=dx.createImageData(lw,lh),d=im.data;
  const W=[255,255,255],lo=[171,165,196],ramp=[lo,[213,210,226],W,W,W].map((c,i)=>i<3?c:W);
  const RAMP5=[[171,165,196],[192,188,212],[213,210,226],[234,232,240],[255,255,255]];
  for(let y=0;y<lh;y++)for(let x=0;x<lw;x++){const u=x/lw,v=y/lh;
    // light on the left, stepping down to lavender toward the right end, with one slow band across it
    let tone=1-u*.95+.18*Math.sin(6.283*(u*1.2+v*.35)+1.3);tone=clamp(tone);
    const f=tone*4,k=f|0,c=RAMP5[Math.min(4,k+((f-k)>bay(x,y)?1:0))],o=(y*lw+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}
  dx.putImageData(im,0,0);
  O.save();O.translate(cx,cy);O.rotate(rot);O.transform(1,0,sk,1,0,0);
  O.fillStyle='#000';O.fillRect(-w/2+size*.12,-h/2+size*.14,w,h);
  O.imageSmoothingEnabled=false;O.drawImage(dc,-w/2,-h/2,w,h);O.imageSmoothingEnabled=true;
  O.lineWidth=Math.max(4,size*.06);O.strokeStyle='#000';O.strokeRect(-w/2,-h/2,w,h);
  O.font=font;O.textBaseline='middle';O.textAlign='left';O.fillStyle='#000';
  run.g.forEach(g=>O.fillText(g.ch,-run.w/2+g.x,size*.04));
  O.restore();
}
function paintType(cw,ch,lines,opt={}){
  const out=mk(cw,ch),O=out.getContext('2d');
  const fillC=mk(cw,ch),F=fillC.getContext('2d');
  const bands=[],late=[];
  for(const L of lines){
    const style=L.style||'marker';
    // round 8: marker lines track at .2 (was .1: the rims fused, CUT IT read CUTTT) and can be fitted to a width
    const face=style==='mono'?'italic 700 "IBM Plex Mono"':(style==='pix'?'"VT323"':'"Cyberway Riders"'),trk=L.track??(style==='marker'?.2:.02);
    const size=L.fit?L.fit*cw*100/glyphRun(L.t,face,100,trk).w:L.size*cw;
    const font=style==='mono'?'700 '+'"IBM Plex Mono"':style==='pix'?'"VT323"':'"Cyberway Riders"';
    const fontStr=f=>style==='mono'?`italic 700 ${size}px "IBM Plex Mono"`:`${size}px ${style==='pix'?'"VT323"':'"Cyberway Riders"'}`;
    const run=glyphRun(L.t,face,size,trk);
    let x0=L.x*cw-(L.align==='left'?0:L.align==='right'?run.w:run.w/2);
    const y0=L.y*ch;
    if(style==='plate'){const rot=L.rot||0,cx=L.x*cw,cy=y0;late.push(()=>silverPlate(O,L.t,cx,cy,size,rot,cw));continue}
    bands.push({y:y0-size*.55,h:size*1.05});
    run.g.forEach((gl,i)=>{
      const seed=(L.seed||1)*97+i;
      const rot=(L.rot||0)+(hash(seed,1)-.5)*(L.jit??.07);
      const sc=1+(hash(seed,2)-.5)*(L.sjit??.07);
      const dy=(hash(seed,3)-.5)*size*(L.yjit??.05);
      const cx=x0+gl.x+gl.w/2,cy=y0+dy;
      const put=(ctx,fn)=>{ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(sc,sc);ctx.font=fontStr();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineCap='round';fn(ctx);ctx.restore()};
      if(style==='marker'){
        const ow=size*(L.ow||.1);
        put(O,c=>{ // ink drop
          c.translate(size*.05,size*.06);c.lineWidth=ow;c.strokeStyle='#000';c.fillStyle='#000';c.strokeText(gl.ch,0,0);c.fillText(gl.ch,0,0)});
        put(O,c=>{ // rough marker outline: three passes, slightly off each other
          c.strokeStyle=L.outline||PAL.pink;c.fillStyle=L.outline||PAL.pink;
          for(let k=0;k<3;k++){c.save();c.translate((hash(seed,10+k)-.5)*size*.018,(hash(seed,20+k)-.5)*size*.018);c.lineWidth=ow*(.92+hash(seed,30+k)*.16);c.strokeText(gl.ch,0,0);c.restore()}
          c.fillText(gl.ch,0,0);
          c.lineWidth=size*.028;c.strokeStyle='#000';c.strokeText(gl.ch,0,0)}); // ink keyline between fill and rim
        put(F,c=>{c.fillStyle=L.fill||PAL.acid;c.fillText(gl.ch,0,0)});
      } else if(style==='mono'||style==='pix'){
        late.push(()=>{put(O,c=>{c.translate(size*.04,size*.05);c.lineWidth=size*.16;c.strokeStyle='#000';c.strokeText(gl.ch,0,0);c.fillStyle='#000';c.fillText(gl.ch,0,0)});
        put(O,c=>{c.lineWidth=size*.12;c.strokeStyle=L.outline||'#000';c.strokeText(gl.ch,0,0);c.fillStyle=L.fill||'#fff';c.fillText(gl.ch,0,0)})});
      }
    });
  }
  // print the fill: ink dots on the colour + a dithered green foot per line
  F.globalCompositeOperation='source-atop';
  F.fillStyle=dotPattern(F,Math.max(5,Math.round(cw/360)),.28);F.fillRect(0,0,cw,ch);
  const foot=mk(cw,ch),FT=foot.getContext('2d'),im=FT.createImageData(cw,ch),cell=Math.max(3,Math.round(cw/520));
  const g=hx(opt.foot||PAL.green);
  for(const b of bands){
    for(let y=Math.max(0,b.y|0);y<Math.min(ch,b.y+b.h);y++){
      const t=clamp(((y-b.y)/b.h-.5)/.42);
      for(let x=0;x<cw;x++){if(t>bay((x/cell)|0,(y/cell)|0)){const o=(y*cw+x)*4;im.data[o]=g[0];im.data[o+1]=g[1];im.data[o+2]=g[2];im.data[o+3]=255}}
    }
  }
  FT.putImageData(im,0,0);F.drawImage(foot,0,0);
  O.drawImage(fillC,0,0);late.forEach(f=>f());
  return out;
}

// ============================================================ 2D helpers
function cover(ctx,img,x,y,w,h,fx=.5,fy=.5){const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s;ctx.drawImage(img,(img.width-sw)*fx,(img.height-sh)*fy,sw,sh,x,y,w,h)}
function shardField(ctx,w,h,vx,vy,cols,seed=1,dots=true){
  ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
  let a=hash(seed,0)*6.28;const end=a+6.283;let i=0;
  while(a<end){const wd=.06+hash(seed,i+1)*.28,c=cols[i%cols.length];
    if(c){ctx.beginPath();ctx.moveTo(vx,vy);ctx.arc(vx,vy,Math.hypot(w,h)*1.2,a,a+wd);ctx.closePath();ctx.fillStyle=c;ctx.fill();if(dots){ctx.fillStyle=dotPattern(ctx,7,.6);ctx.fill()}ctx.lineWidth=w*.009;ctx.strokeStyle='#000';ctx.stroke()}
    a+=wd;i++}
  const g=ctx.createRadialGradient(vx,vy,0,vx,vy,w*.38);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
function grain(ctx,w,h,amt=10){const im=ctx.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){const n=(hash(i,77)-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}ctx.putImageData(im,0,0)}
function splitText(ctx,t,x,y,size,rot,sp,font='"Cyberway Riders"',col='#fff',track=.14){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px ${font}`;ctx.textBaseline='middle';
  const run=glyphRun(t,font,size,track);const x0=-run.w/2;
  for(const [dx,dy,c] of [[sp*1.15,sp*1.3,'#000'],[-sp*2.1,0,'rgba(255,46,136,.5)'],[sp*2.1,0,'rgba(0,240,216,.5)'],[-sp,0,PAL.pink],[sp,0,PAL.cyan],[0,0,col]]){ctx.fillStyle=c;run.g.forEach(g=>ctx.fillText(g.ch,x0+g.x+dx,dy))}
  ctx.restore();
}
function plate(ctx,x,y,w,h,rot,fill,text,font,tcol='#000',slant=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  const path=()=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,0);ctx.lineTo(w-slant,h);ctx.lineTo(0,h);ctx.closePath()};
  ctx.save();ctx.translate(h*.12,h*.14);path();ctx.fillStyle='#000';ctx.fill();ctx.restore();
  path();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=Math.max(3,h*.06);ctx.strokeStyle='#000';ctx.stroke();
  ctx.fillStyle=tcol;ctx.font=font;ctx.textBaseline='middle';ctx.fillText(text,h*.32,h*.53);ctx.restore();
}
// cut-out sticker: alpha image with a thick accent rim, red/cyan ghosts and an ink drop
function sticker(img,rim,acc,opts={}){
  const pad=rim*3,c=mk(img.width+pad*2,img.height+pad*2),x=c.getContext('2d');
  const sil=(col)=>{const s=mk(c.width,c.height),sx=s.getContext('2d');sx.drawImage(img,pad,pad);sx.globalCompositeOperation='source-in';sx.fillStyle=col;sx.fillRect(0,0,s.width,s.height);return s};
  const dil=(col,r)=>{const s=sil(col),d=mk(c.width,c.height),dx=d.getContext('2d');for(let a=0;a<24;a++){dx.drawImage(s,Math.cos(a/24*6.283)*r,Math.sin(a/24*6.283)*r)}dx.drawImage(s,0,0);return d};
  x.drawImage(dil('#000',rim*1.3),rim*.7,rim*.9);
  x.drawImage(dil(PAL.pink,rim),-rim*.6,0);x.drawImage(dil(PAL.cyan,rim),rim*.6,0);
  x.drawImage(dil(acc,rim),0,0);x.drawImage(dil('#000',rim*.25),0,0);
  if(opts.fill){x.drawImage(sil(opts.fill),0,0)}else x.drawImage(img,pad,pad);
  return c;
}

// ============================================================ 3D: voxels, prints, panels
let R,SCN,CAM;
function initGL(w,h,bg){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true,alpha:true});
  R.setPixelRatio(1);R.setSize(w,h,false);
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.NoToneMapping;
  SCN=new THREE.Scene();if(bg!==null)SCN.background=new THREE.Color(bg||'#000');
  return cv;
}
const tex=c=>{const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t};
function mask(fn,w,h){const m=[];for(let j=0;j<h;j++){m[j]=[];for(let i=0;i<w;i++)m[j][i]=fn(i+.5-w/2,j+.5-h/2)?1:0}return m}
function stad(x,y,a,r){const dx=Math.max(Math.abs(x)-(a-r),0);return Math.hypot(dx,y)<=r}
function poly(pts){return(x,y)=>{let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}}
const MASK={
  ring:()=>mask((x,y)=>stad(x,y,7.5,3.5)&&!stad(x,y,4.5,1.5),15,7),
  brokenRing:()=>mask((x,y)=>stad(x,y,7.5,3.5)&&!stad(x,y,4.5,1.5)&&!(x>3.2&&x<5.6&&y<0),15,7),
  star:(n=23)=>{const p=[];for(let i=0;i<10;i++){const r=i%2?n*.2:n*.5,a=-Math.PI/2+i*Math.PI/5;p.push([Math.cos(a)*r,Math.sin(a)*r+n*.04])}return mask(poly(p),n,n)},
  sparkle:(n=21)=>{const r=n/2,k=.17;return mask(poly([[0,-r],[r*k,-r*k],[r,0],[r*k,r*k],[0,r],[-r*k,r*k],[-r,0],[-r*k,-r*k]]),n,n)},
  heart:(n=19)=>mask((x,y)=>{x/=n*.42;y=-y/(n*.42)+.15;return Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0},n,n),
  bolt:()=>mask(poly([[-9,-1],[2,-5],[0,-9],[10,1],[-1,5],[1,9]].map(([a,b])=>[a,b])),21,19),
};
const CURSOR=[
'K...........','KK..........','KWK.........','KWWK........','KWWWK.......','KWWWWK......','KWWWWWK.....','KWWWWWWK....',
'KWWWWWWWK...','KWWWWWWWWK..','KWWWWWWWWWK.','KWWWWWWKKKKK','KWWWKWWK....','KWWKKWWK....','KWK..KWWK...','KK...KWWK...',
'K.....KWWK..','......KWWK..','.......KK...'];
// voxel object from a 2D mask, extruded `depth` cells; colour per voxel = dithered ramp across x/y (print in 3D)
function voxels(m,depth,colorFn,cell=.18,bevel=.9){
  const cubes=[];const h=m.length,w=m[0].length;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(m[j][i])for(let k=0;k<depth;k++)cubes.push([i,j,k,m[j][i]]);
  const geo=new THREE.BoxGeometry(cell*bevel,cell*bevel,cell*bevel);
  const mat=new THREE.MeshStandardMaterial({roughness:.5,metalness:0});
  const im=new THREE.InstancedMesh(geo,mat,cubes.length);
  const M=new THREE.Matrix4(),C=new THREE.Color();
  cubes.forEach(([i,j,k,v],n)=>{M.makeTranslation((i-w/2+.5)*cell,(h/2-j-.5)*cell,(k-depth/2+.5)*cell);im.setMatrixAt(n,M);C.set(colorFn(i,j,k,w,h,depth,v)).convertSRGBToLinear();im.setColorAt(n,C)});
  im.castShadow=true;im.receiveShadow=true;
  const g=new THREE.Group();g.add(im);return g;
}
const rampFn=(ramp,lo=1,hi=3.4,dir='diag')=>(i,j,k,w,h,d)=>{
  let t=dir==='x'?i/(w-1):dir==='y'?1-j/(h-1):(i/(w-1)*.6+(1-j/(h-1))*.4);
  let v=lo+t*(hi-lo),q=Math.floor(v);if(v-q>bay(i+k*2,j+k))q++;return ramp[clamp(q,0,ramp.length-1)];
};
// a chain of voxel links along x; alternate links turned 90deg about the chain axis so they interlock
function voxelChain(n,ramp,cell=.16,opts={}){
  const g=new THREE.Group(),pitch=11*cell,lo=opts.lo??1.2,hi=opts.hi??3.3;
  const ringC=voxels(MASK.ring(),2,rampFn(ramp,lo,hi,'x'),cell);
  for(let i=0;i<n;i++){
    if(opts.skip&&opts.skip.includes(i))continue;
    const link=(opts.broken===i?voxels(MASK.brokenRing(),2,rampFn(ramp,lo,hi,'x'),cell):ringC.clone());
    link.position.x=(i-(n-1)/2)*pitch;if(i%2)link.rotation.x=Math.PI/2;
    g.add(link);
  }
  return g;
}
// a photo print: white border, slight curl, real shadow
function print(img,w,border=.06,curl=.25,caption){
  const ar=img.height/img.width,pw=1024,ph=Math.round(pw*ar),bpx=Math.round(pw*border),cap=caption?Math.round(pw*.12):0;
  const c=mk(pw+bpx*2,ph+bpx*2+cap),x=c.getContext('2d');x.fillStyle='#f4f2ec';x.fillRect(0,0,c.width,c.height);x.drawImage(img,bpx,bpx,pw,ph);
  if(caption){x.fillStyle='#111';x.font='italic 700 46px "IBM Plex Mono"';x.fillText(caption,bpx,ph+bpx+cap*.62)}
  const h=w*c.height/c.width,geo=new THREE.PlaneGeometry(w,h,24,24),p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const u=p.getX(i)/w*2,v=p.getY(i)/h*2;p.setZ(i,curl*(u*u*.6+v*v*.25+Math.max(0,u*v)*.3))}
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex(c),roughness:.42,side:THREE.DoubleSide}));
  m.castShadow=true;m.receiveShadow=true;return m;
}
// a flat sticker/type panel lying on the surface; its alpha casts a real shadow
function panel(c,w,lift=.2){
  const h=w*c.height/c.width,t=tex(c);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,transparent:true,alphaTest:.5,roughness:.9}));
  m.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:t,alphaTest:.5});
  m.castShadow=true;m.receiveShadow=true;m.rotation.x=-Math.PI/2;m.position.y=lift;return m;
}
// the surface: black tiles, grout glowing faintly in the accent (the site's grid floor, seen from above)
// Electric pass (round 2): the tile is pure black, the grout is self-lit neon (emissive, so shadows never grey it),
// and the accent pools in a bloom at the vanishing point instead of a coloured light that tinted every object.
function floor(acc,size=60,tiles=1.15,pool=[.56,.42]){
  const px=4096,c=mk(px,px),x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,px,px);
  const n=Math.round(size/tiles),s=px/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=hash(i,j)*3;x.fillStyle=`rgb(${v},${v},${v+1})`;x.fillRect(i*s+3,j*s+3,s-6,s-6)}
  const e=mk(px,px),E=e.getContext('2d');E.fillStyle='#000';E.fillRect(0,0,px,px);
  const g=E.createRadialGradient(px*pool[0],px*pool[1],0,px*pool[0],px*pool[1],px*.16);
  const [r,gg,b]=hx(acc);g.addColorStop(0,`rgba(${r},${gg},${b},.55)`);g.addColorStop(.4,`rgba(${r},${gg},${b},.18)`);g.addColorStop(1,`rgba(${r},${gg},${b},0)`);

  [...t].forEach((ch,i)=>{const f=ch===' '?0:(hash(seed,i)<.6?0:hash(seed,i+50)<.5?1:2);const s=size*(f===1?1.25:f===2?.9:1)*(.9+hash(seed,i+90)*.2);x.font=(f===2?'italic 700 ':'')+s+'px '+fonts[f].replace('italic 700 ','');const w=x.measureText(ch).width+size*.08;items.push({ch,f,s,w});tw+=w});
  let px=cx-tw/2;items.forEach((it,i)=>{x.save();x.translate(px+it.w/2,cy+(hash(seed,i+200)-.5)*size*.12);x.rotate((hash(seed,i+300)-.5)*.2);x.font=(it.f===2?'italic 700 ':'')+it.s+'px '+fonts[it.f].replace('italic 700 ','');x.textAlign='center';x.textBaseline='middle';
    const chip=it.ch!==' '&&hash(seed,i+400)<.22;
    if(chip){x.fillStyle='#000';x.fillRect(-it.w/2+5,-it.s*.5+6,it.w,it.s);x.fillStyle=hash(seed,i+500)<.5?'#fff':PAL.acid;x.fillRect(-it.w/2,-it.s*.5,it.w,it.s);x.fillStyle='#000';x.fillText(it.ch,0,it.s*.04)}
    else{x.fillStyle='#000';x.fillText(it.ch,4,5);x.fillStyle=PAL.pink;x.fillText(it.ch,-3,0);x.fillStyle=PAL.cyan;x.fillText(it.ch,3,0);x.fillStyle='#fff';x.fillText(it.ch,0,0)}
    x.restore();px+=it.w});
}
function slices(x,w,h,seed){for(let i=0;i<5;i++){const y=hash(seed,i)*h,hh=10+hash(seed,i+9)*40,o=(hash(seed,i+19)-.5)*70;x.drawImage(x.canvas,0,y,w,hh,o,y,w,hh)}}
function chips(x){[['SHOT 014',120,260,PAL.acid],['ISO 3200',760,1180,'#fff']].forEach(([t,cx,cy,c])=>{x.font='600 28px "IBM Plex Mono"';const w=x.measureText(t).width+30;x.fillStyle='#000';x.fillRect(cx+6,cy+6,w,44);x.fillStyle=c;x.fillRect(cx,cy,w,44);x.fillStyle='#000';x.fillText(t,cx+15,cy+31)})}

// ============================================================ MOTION TEST (round 8): 7s, 24fps, hits on 2s
// One built world per shot, type in depth (a word BEHIND him, a plate in FRONT), a new photo every few frames, the chain
// strain -> white frame -> burst, the logo end card. Everything is pre-rendered once; a frame is only blits.
// window.FRAME(n) draws frame n; render-reel.mjs walks it and hands the frames to ffmpeg.
DRAFTS.m1=async()=>{
  const out=mk(RW,RH),X=out.getContext('2d'),cmp=mk(RW,RH),x=cmp.getContext('2d'),tmp=mk(RW,RH),T=tmp.getContext('2d');
  const half=c=>{const o=mk(RW,RH);o.getContext('2d').drawImage(c,0,0,RW,RH);return o};
  const world=(acc,o)=>half(siteWorld(acc,{w:RW,h:RH,...o}));
  const WP=world(PAL.pink,{vp:[560,760],seed:11,wedge:[[60,900],[1300,-500],[1300,2300]],streaks:[[-2.7,1100,10],[-.5,1000,7],[2.3,900,6]],ink:[[-1.2,.05],[2,.05]],stars:[[110,1500,50,PAL.acid]],sparkles:[[960,420,36]],pixels:[[130,1120,PAL.cyan,0,.3]]});
  const WC=world(PAL.cyan,{vp:[540,800],seed:23,wedge:[[1040,860],[-240,-500],[-240,2300]],streaks:[[-.45,1100,9],[.5,1100,9],[2.6,900,6]],ink:[[-1.45,.05],[1.2,.05]],stars:[[960,1560,44,PAL.pink]],sparkles:[[120,420,34]],pixels:[[960,520,PAL.pink,0,.2]]});
  const WA=world(PAL.acid,{vp:[540,900],seed:5,wedge:[[540,260],[-600,2300],[1680,2300]],streaks:[[-2.5,1100,10],[-.6,1100,9],[1,900,6],[2.2,900,6]],ink:[[1.35,.045],[1.85,.04]],stars:[[960,330,44,PAL.pink],[100,420,30,PAL.cyan]],sparkles:[[120,1000,30]],pixels:[[950,760,PAL.pink,1,.25]]});
  const cut=await loadImg('../../../website/site/jatin-cutout.png');
  const ME=sticker(cut,13,PAL.acid),MEP=sticker(cut,13,PAL.pink),SIL=sticker(cut,13,PAL.acid,{fill:PAL.pink});
  const word=(t,fit,h=560)=>paintType(RW*1.25|0,h,[{t,fit:fit/1.25,x:.5,y:.5,seed:t.length*7+3}]);
  const WD={never:word('I NEVER',.8),cons:word('CONSUMED',.8),until:word('UNTIL IT',.8),showed:word('SHOWED',.8),up:word('UP',.56,900)};
  const plateC=(t,size)=>{const c=mk(RW,220),g=c.getContext('2d');silverPlate(g,t,RW/2,110,size,0,RW);return c};
  const PL={brand:plateC('designed a brand',44),just:plateC('i just',54),jj:plateC('just jatin',46)};
  const ph=await Promise.all(['flux-01/01','flux-02/03','outstation/02','flux-03/02','flux-01/05','outstation/05','flux-02/09','flux-03/05'].map(n=>loadImg('../../../website/site/work/'+n+'.jpg')));
  const PH=ph.map(im=>{const c=mk(RW,RH);cover(c.getContext('2d'),im,0,0,RW,RH);return c});
  const links=chainCurve([[540,800],[300,640],[190,900],[470,1160],[820,1190],[1300,1560]],.36,2.9,6.4),palA=chPal(PAL.acid);
  const slam=k=>k<0?0:[1.7,.9,1.05,1][Math.min(k,3)],ease=t=>1-Math.pow(1-clamp(t),3);
  const spr=(c,cx,cy,sc=1,rot=0,al=1)=>{if(sc<=0)return;x.save();x.globalAlpha=al;x.translate(cx,cy);x.rotate(rot);x.scale(sc,sc);x.drawImage(c,-c.width/2,-c.height/2);x.restore()};
  const bg=(c,vp,z)=>{x.save();x.translate(vp[0],vp[1]);x.scale(z,z);x.translate(-vp[0],-vp[1]);x.drawImage(c,0,0);x.restore()};
  const me=(c,dy=0,w=RW*.98,ox=40)=>{const h=w*c.height/c.width;x.drawImage(c,(RW-w)/2+ox,RH-h+70+dy,w,h)};
  const speed=(cx,cy,seed,n=26)=>{x.save();x.fillStyle='#fff';for(let i=0;i<n;i++){const a=hash(seed,i)*6.283,r0=260+hash(seed,i+40)*300,r1=1500,wd=.006+hash(seed,i+80)*.012;x.beginPath();x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);x.lineTo(cx+Math.cos(a-wd)*r1,cy+Math.sin(a-wd)*r1);x.lineTo(cx+Math.cos(a+wd)*r1,cy+Math.sin(a+wd)*r1);x.fill()}x.restore()};
  const mark=()=>{splitText(x,'JATIN',118,110,46,-.06,2)};
  function scene(f){
    const s2=f>>1;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,RW,RH);let split=0,sl=0;
    if(f<2){}
    else if(f<40){ // A · pink: the word lands BEHIND him, the plate in FRONT
      const k=f-2;bg(WP,[560,760],1.5-.47*ease(k/6)+.0012*k);split=k<6?18*(1-k/6):0;
      spr(WD.never,RW*.5,RH*.4,slam((f-6)>>1),-.05);
      const mk2=(f-10)>>1;if(mk2>=0)me(ME,[420,-34,12,0][Math.min(mk2,3)]);
      if(f>=18)spr(PL.brand,RW*.5,RH*.8,slam((f-18)>>1),-.04); // on his chest, never over his face
      if(f===6||f===7||f===10||f===11)split=22;if(f>=36)sl=f;mark();
    } else if(f<80){ // B · his photos, a new one every 4 frames; he is a flat pink cut-out
      const k=f-40;if(k<1){x.fillStyle='#fff';x.fillRect(0,0,RW,RH);return{split:0,sl:0}}
      const i=(k>>2)%PH.length,z=1.06-.06*((k&3)/3);x.save();x.translate(RW/2,RH/2);x.scale(z,z);x.drawImage(PH[i],-RW/2,-RH/2);x.restore();
      me(SIL,0,RW*.6,-210); // small, in the corner: the photos are the shot
      spr(PL.just,RW*.3,RH*.27,slam((f-44)>>1),-.05);
      spr(WD.cons,RW*.5,RH*.37,slam((f-48)>>1)*(1+.05*((k&7)<2&&f>56?1:0)),.03);
      split=(k&3)===0?7:0;if((k&7)===0)sl=f;mark();
    } else if(f<96){ // C · cyan: the chain pulled tight, straining
      const k=f-80;bg(WC,[540,800],1.25-.22*ease(k/5)+.002*k);
      const n=Math.min(links.length,2+k*4),j=k>8?(k-8)*.9:0;
      x.save();x.translate((hash(s2,1)-.5)*j,(hash(s2,2)-.5)*j);layChain(x,links.slice(0,n),palA);x.restore();
      spr(WD.until,RW*.5,RH*.2,slam((f-84)>>1),-.04);
      split=k<4?16:j*1.2;if(k>10)sl=f;mark();
    } else if(f<144){ // D · the snap: white frame, burst, acid world, he lands, beats on 8s
      const k=f-96;if(k<2){x.fillStyle='#fff';x.fillRect(0,0,RW,RH);return{split:0,sl:0}}
      const beat=(k>=8&&k%8<2)?1:0;bg(WA,[540,900],1.6-.57*ease((k-2)/5)+.0015*k+beat*.03);
      if(k<8){speed(540,900,s2);burst(x,540,900,520-k*30,5)}
      spr(WD.showed,RW*.5,RH*.17,slam((f-100)>>1)*(1+beat*.04),-.05);
      spr(WD.up,RW*.5,RH*.36,slam((f-104)>>1)*(1+beat*.06),.04);
      const mk2=(f-108)>>1;if(mk2>=0)me(MEP,[460,-40,14,0][Math.min(mk2,3)]);
      split=k<8?26*(1-k/8):beat*9;if(beat&&k>16)sl=f;mark();
    } else { // E · end card
      const k=f-144;if(k<1){x.fillStyle='#fff';x.fillRect(0,0,RW,RH);return{split:0,sl:0}}
      const sc=slam(k>>1);x.save();x.translate(RW/2,RH*.46);x.scale(sc,sc);splitText(x,'JATIN',0,0,300,-.05,k<8?14:5);x.restore();
      if(k>=6)spr(PL.jj,RW*.5,RH*.57,slam((k-6)>>1),-.04);split=k<6?20:0;if(k>=20)sl=f;
    }
    return{split,sl};
  }
  window.NFRAMES=168;
  window.FRAME=f=>{
    const {split,sl}=scene(f);if(sl)slices(x,RW,RH,sl);
    X.globalCompositeOperation='source-over';X.fillStyle='#000';X.fillRect(0,0,RW,RH);
    if(split>.5){ // true channel split: red left, green+blue right, added back
      [['#ff0000',-split],['#00ffff',split]].forEach(([c,d])=>{T.globalCompositeOperation='source-over';T.drawImage(cmp,0,0);T.globalCompositeOperation='multiply';T.fillStyle=c;T.fillRect(0,0,RW,RH);X.globalCompositeOperation='lighter';X.drawImage(tmp,d,0)});
      X.globalCompositeOperation='source-over';
    } else X.drawImage(cmp,0,0);
    grain(X,RW,RH,9);return out;
  };
  window.FRAME(+Q.get('f')||30);return out;
};

// ============================================================ boot
(async()=>{
  try{
    await Promise.all([document.fonts.load('100px "Cyberway Riders"'),document.fonts.load('700 40px "IBM Plex Mono"'),document.fonts.load('italic 700 40px "IBM Plex Mono"'),document.fonts.load('600 40px "IBM Plex Mono"'),document.fonts.load('500 40px "IBM Plex Mono"'),document.fonts.load('italic 400 40px "DM Serif Display"'),document.fonts.load('40px "Sterion"'),document.fonts.load('40px VT323'),document.fonts.load('40px "Permanent Marker"')]);
    const out=await DRAFTS[DRAFT]();out.id='out';document.body.appendChild(out);window.READY=true;
  }catch(e){window.ERR=String(e&&e.stack||e);console.error(e)}
})();
</script>
