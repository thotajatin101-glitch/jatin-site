<!-- Dev-only still renderer for posts and reel frames. Never ships. three.js r128 from cdnjs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,500;0,700;1,700&family=VT323&display=swap">

@font-face{font-family:"Cyberway Riders";src:url(../../CyberwayRiders-lg97d.ttf) format("truetype")}
html,body{margin:0;background:#111}
canvas{display:block}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<body>
<script>
const Q=new URLSearchParams(location.search);
const DRAFT=Q.get('d')||'p1';
const PAL={acid:'#e8ff00',cyan:'#00f0d8',pink:'#ff2e88',mag:'#c81ee0',purple:'#7a12b0',green:'#39e639',chrome:'#c3cadf',ink:'#000000',paper:'#ffffff'};
const RAMP={
  cyan:['#00262a','#006f73','#00f0d8','#7ffcef','#e9fffc'],
  pink:['#3a0a52','#9a1460','#ff2e88','#ff8cc0','#fff0f7'],
  acid:['#1a3d00','#39e639','#e8ff00','#f4ff8a','#fdffe0'],
  mag:['#2a0640','#7a12b0','#c81ee0','#e48cf2','#fbeefe'],
  chrome:['#0b0c10','#4a5068','#c3cadf','#eef1fa','#ffffff'],
  ink:['#000000','#07070a','#101118','#1d1f29','#2c2f3c']
};
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay=(i,j)=>(B4[(j&3)*4+(i&3)]+.5)/16;
const hash=(a,b=0)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const loadImg=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('img '+src));i.src=src});
const W=root=>root;

// ============================================================ TYPE
// Cyberway, hand-sticker treatment: acid fill printed with dots and a dithered green foot,
// thick rough pink marker outline, hard ink drop. Every glyph jostled like hand lettering.
function dotTile(px,alpha){const c=mk(px,px),x=c.getContext('2d');x.fillStyle=`rgba(0,0,0,${alpha})`;x.beginPath();x.arc(px/2,px/2,px*.28,0,7);x.fill();return c}
function dotPattern(ctx,px,alpha,ang=23){const p=ctx.createPattern(dotTile(px,alpha),'repeat');p.setTransform(new DOMMatrix().rotate(ang));return p}
function glyphRun(text,font,size,track){
  const c=mk(8,8).getContext('2d');c.font=font.startsWith('italic')?font.replace('italic 700 ',`italic 700 ${size}px `):`${size}px ${font}`;let x=0;const g=[];
  for(const ch of text){const w=c.measureText(ch).width;g.push({ch,x,w});x+=w+track*size}
  return{g,w:x-track*size};
}
function paintType(cw,ch,lines,opt={}){
  const out=mk(cw,ch),O=out.getContext('2d');
  const fillC=mk(cw,ch),F=fillC.getContext('2d');
  const bands=[],late=[];
  for(const L of lines){
    const style=L.style||'marker';
    const size=L.size*cw;
    const font=style==='mono'?'700 '+'"IBM Plex Mono"':style==='pix'?'"VT323"':'"Cyberway Riders"';
    const fontStr=f=>style==='mono'?`italic 700 ${size}px "IBM Plex Mono"`:`${size}px ${style==='pix'?'"VT323"':'"Cyberway Riders"'}`;
    const run=glyphRun(L.t,style==='mono'?'italic 700 "IBM Plex Mono"':(style==='pix'?'"VT323"':'"Cyberway Riders"'),size,L.track??(style==='marker'?.1:.02));
    let x0=L.x*cw-(L.align==='left'?0:L.align==='right'?run.w:run.w/2);
    const y0=L.y*ch;
    bands.push({y:y0-size*.55,h:size*1.05});
    run.g.forEach((gl,i)=>{
      const seed=(L.seed||1)*97+i;
      const rot=(L.rot||0)+(hash(seed,1)-.5)*(L.jit??.14);
      const sc=1+(hash(seed,2)-.5)*(L.sjit??.14);
      const dy=(hash(seed,3)-.5)*size*(L.yjit??.08);
      const cx=x0+gl.x+gl.w/2,cy=y0+dy;
      const put=(ctx,fn)=>{ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(sc,sc);ctx.font=fontStr();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineCap='round';fn(ctx);ctx.restore()};
      if(style==='marker'){
        const ow=size*(L.ow||.15);
        put(O,c=>{ // ink drop
          c.translate(size*.05,size*.06);c.lineWidth=ow;c.strokeStyle='#000';c.fillStyle='#000';c.strokeText(gl.ch,0,0);c.fillText(gl.ch,0,0)});
        put(O,c=>{ // rough marker outline: three passes, slightly off each other
          c.strokeStyle=L.outline||PAL.pink;c.fillStyle=L.outline||PAL.pink;
          for(let k=0;k<3;k++){c.save();c.translate((hash(seed,10+k)-.5)*size*.018,(hash(seed,20+k)-.5)*size*.018);c.lineWidth=ow*(.92+hash(seed,30+k)*.16);c.strokeText(gl.ch,0,0);c.restore()}
          c.fillText(gl.ch,0,0)});
        put(F,c=>{c.fillStyle=L.fill||PAL.acid;c.fillText(gl.ch,0,0)});
      } else if(style==='mono'||style==='pix'){
        late.push(()=>{put(O,c=>{c.translate(size*.04,size*.05);c.lineWidth=size*.16;c.strokeStyle='#000';c.strokeText(gl.ch,0,0);c.fillStyle='#000';c.fillText(gl.ch,0,0)});
        put(O,c=>{c.lineWidth=size*.12;c.strokeStyle=L.outline||'#000';c.strokeText(gl.ch,0,0);c.fillStyle=L.fill||'#fff';c.fillText(gl.ch,0,0)})});
      }
    });
  }
  // print the fill: ink dots on the colour + a dithered green foot per line
  F.globalCompositeOperation='source-atop';
  F.fillStyle=dotPattern(F,Math.max(5,Math.round(cw/360)),.28);F.fillRect(0,0,cw,ch);
  const foot=mk(cw,ch),FT=foot.getContext('2d'),im=FT.createImageData(cw,ch),cell=Math.max(3,Math.round(cw/520));
  const g=hx(opt.foot||PAL.green);
  for(const b of bands){
    for(let y=Math.max(0,b.y|0);y<Math.min(ch,b.y+b.h);y++){
      const t=clamp(((y-b.y)/b.h-.5)/.42);
      for(let x=0;x<cw;x++){if(t>bay((x/cell)|0,(y/cell)|0)){const o=(y*cw+x)*4;im.data[o]=g[0];im.data[o+1]=g[1];im.data[o+2]=g[2];im.data[o+3]=255}}
    }
  }
  FT.putImageData(im,0,0);F.drawImage(foot,0,0);
  O.drawImage(fillC,0,0);late.forEach(f=>f());
  return out;
}

// ============================================================ 2D helpers
function cover(ctx,img,x,y,w,h,fx=.5,fy=.5){const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s;ctx.drawImage(img,(img.width-sw)*fx,(img.height-sh)*fy,sw,sh,x,y,w,h)}
function shardField(ctx,w,h,vx,vy,cols,seed=1,dots=true){
  ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
  let a=hash(seed,0)*6.28;const end=a+6.283;let i=0;
  while(a<end){const wd=.06+hash(seed,i+1)*.28,c=cols[i%cols.length];
    if(c){ctx.beginPath();ctx.moveTo(vx,vy);ctx.arc(vx,vy,Math.hypot(w,h)*1.2,a,a+wd);ctx.closePath();ctx.fillStyle=c;ctx.fill();if(dots){ctx.fillStyle=dotPattern(ctx,7,.6);ctx.fill()}ctx.lineWidth=w*.009;ctx.strokeStyle='#000';ctx.stroke()}
    a+=wd;i++}
  const g=ctx.createRadialGradient(vx,vy,0,vx,vy,w*.38);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
function grain(ctx,w,h,amt=10){const im=ctx.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){const n=(hash(i,77)-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}ctx.putImageData(im,0,0)}
function splitText(ctx,t,x,y,size,rot,sp,font='"Cyberway Riders"',col='#fff',track=.14){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${size}px ${font}`;ctx.textBaseline='middle';
  const run=glyphRun(t,font,size,track);const x0=-run.w/2;
  for(const [dx,dy,c] of [[sp*1.15,sp*1.3,'#000'],[-sp*2.1,0,'rgba(255,46,136,.5)'],[sp*2.1,0,'rgba(0,240,216,.5)'],[-sp,0,PAL.pink],[sp,0,PAL.cyan],[0,0,col]]){ctx.fillStyle=c;run.g.forEach(g=>ctx.fillText(g.ch,x0+g.x+dx,dy))}
  ctx.restore();
}
function plate(ctx,x,y,w,h,rot,fill,text,font,tcol='#000',slant=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  const path=()=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,0);ctx.lineTo(w-slant,h);ctx.lineTo(0,h);ctx.closePath()};
  ctx.save();ctx.translate(h*.12,h*.14);path();ctx.fillStyle='#000';ctx.fill();ctx.restore();
  path();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=Math.max(3,h*.06);ctx.strokeStyle='#000';ctx.stroke();
  ctx.fillStyle=tcol;ctx.font=font;ctx.textBaseline='middle';ctx.fillText(text,h*.32,h*.53);ctx.restore();
}
// cut-out sticker: alpha image with a thick accent rim, red/cyan ghosts and an ink drop
function sticker(img,rim,acc,opts={}){
  const pad=rim*3,c=mk(img.width+pad*2,img.height+pad*2),x=c.getContext('2d');
  const sil=(col)=>{const s=mk(c.width,c.height),sx=s.getContext('2d');sx.drawImage(img,pad,pad);sx.globalCompositeOperation='source-in';sx.fillStyle=col;sx.fillRect(0,0,s.width,s.height);return s};
  const dil=(col,r)=>{const s=sil(col),d=mk(c.width,c.height),dx=d.getContext('2d');for(let a=0;a<24;a++){dx.drawImage(s,Math.cos(a/24*6.283)*r,Math.sin(a/24*6.283)*r)}dx.drawImage(s,0,0);return d};
  x.drawImage(dil('#000',rim*1.3),rim*.7,rim*.9);
  x.drawImage(dil(PAL.pink,rim),-rim*.6,0);x.drawImage(dil(PAL.cyan,rim),rim*.6,0);
  x.drawImage(dil(acc,rim),0,0);x.drawImage(dil('#000',rim*.25),0,0);
  if(opts.fill){x.drawImage(sil(opts.fill),0,0)}else x.drawImage(img,pad,pad);
  return c;
}

// ============================================================ 3D: voxels, prints, panels
let R,SCN,CAM;
function initGL(w,h,bg){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true,alpha:true});
  R.setPixelRatio(1);R.setSize(w,h,false);
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.NoToneMapping;
  SCN=new THREE.Scene();if(bg!==null)SCN.background=new THREE.Color(bg||'#000');
  return cv;
}
const tex=c=>{const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t};
function mask(fn,w,h){const m=[];for(let j=0;j<h;j++){m[j]=[];for(let i=0;i<w;i++)m[j][i]=fn(i+.5-w/2,j+.5-h/2)?1:0}return m}
function stad(x,y,a,r){const dx=Math.max(Math.abs(x)-(a-r),0);return Math.hypot(dx,y)<=r}
function poly(pts){return(x,y)=>{let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}}
const MASK={
  ring:()=>mask((x,y)=>stad(x,y,7.5,3.5)&&!stad(x,y,4.5,1.5),15,7),
  brokenRing:()=>mask((x,y)=>stad(x,y,7.5,3.5)&&!stad(x,y,4.5,1.5)&&!(x>3.2&&x<5.6&&y<0),15,7),
  star:(n=23)=>{const p=[];for(let i=0;i<10;i++){const r=i%2?n*.2:n*.5,a=-Math.PI/2+i*Math.PI/5;p.push([Math.cos(a)*r,Math.sin(a)*r+n*.04])}return mask(poly(p),n,n)},
  sparkle:(n=21)=>{const r=n/2,k=.17;return mask(poly([[0,-r],[r*k,-r*k],[r,0],[r*k,r*k],[0,r],[-r*k,r*k],[-r,0],[-r*k,-r*k]]),n,n)},
  heart:(n=19)=>mask((x,y)=>{x/=n*.42;y=-y/(n*.42)+.15;return Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0},n,n),
  bolt:()=>mask(poly([[-9,-1],[2,-5],[0,-9],[10,1],[-1,5],[1,9]].map(([a,b])=>[a,b])),21,19),
};
const CURSOR=[
'K...........','KK..........','KWK.........','KWWK........','KWWWK.......','KWWWWK......','KWWWWWK.....','KWWWWWWK....',
'KWWWWWWWK...','KWWWWWWWWK..','KWWWWWWWWWK.','KWWWWWWKKKKK','KWWWKWWK....','KWWKKWWK....','KWK..KWWK...','KK...KWWK...',
'K.....KWWK..','......KWWK..','.......KK...'];
// voxel object from a 2D mask, extruded `depth` cells; colour per voxel = dithered ramp across x/y (print in 3D)
function voxels(m,depth,colorFn,cell=.18,bevel=.9){
  const cubes=[];const h=m.length,w=m[0].length;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(m[j][i])for(let k=0;k<depth;k++)cubes.push([i,j,k,m[j][i]]);
  const geo=new THREE.BoxGeometry(cell*bevel,cell*bevel,cell*bevel);
  const mat=new THREE.MeshStandardMaterial({roughness:.32,metalness:.02});
  const im=new THREE.InstancedMesh(geo,mat,cubes.length);
  const M=new THREE.Matrix4(),C=new THREE.Color();
  cubes.forEach(([i,j,k,v],n)=>{M.makeTranslation((i-w/2+.5)*cell,(h/2-j-.5)*cell,(k-depth/2+.5)*cell);im.setMatrixAt(n,M);C.set(colorFn(i,j,k,w,h,depth,v)).convertSRGBToLinear();im.setColorAt(n,C)});
  im.castShadow=true;im.receiveShadow=true;
  const g=new THREE.Group();g.add(im);return g;
}
const rampFn=(ramp,lo=1,hi=3.4,dir='diag')=>(i,j,k,w,h,d)=>{
  let t=dir==='x'?i/(w-1):dir==='y'?1-j/(h-1):(i/(w-1)*.6+(1-j/(h-1))*.4);
  let v=lo+t*(hi-lo),q=Math.floor(v);if(v-q>bay(i+k*2,j+k))q++;return ramp[clamp(q,0,ramp.length-1)];
};
// a chain of voxel links along x; alternate links turned 90deg about the chain axis so they interlock
function voxelChain(n,ramp,cell=.16,opts={}){
  const g=new THREE.Group(),pitch=11*cell,lo=opts.lo??1.2,hi=opts.hi??3.3;
  const ringC=voxels(MASK.ring(),2,rampFn(ramp,lo,hi,'x'),cell);
  for(let i=0;i<n;i++){
    if(opts.skip&&opts.skip.includes(i))continue;
    const link=(opts.broken===i?voxels(MASK.brokenRing(),2,rampFn(ramp,lo,hi,'x'),cell):ringC.clone());
    link.position.x=(i-(n-1)/2)*pitch;if(i%2)link.rotation.x=Math.PI/2;
    g.add(link);
  }
  return g;
}
// a photo print: white border, slight curl, real shadow
function print(img,w,border=.06,curl=.25,caption){
  const ar=img.height/img.width,pw=1024,ph=Math.round(pw*ar),bpx=Math.round(pw*border),cap=caption?Math.round(pw*.12):0;
  const c=mk(pw+bpx*2,ph+bpx*2+cap),x=c.getContext('2d');x.fillStyle='#f4f2ec';x.fillRect(0,0,c.width,c.height);x.drawImage(img,bpx,bpx,pw,ph);
  if(caption){x.fillStyle='#111';x.font='italic 700 46px "IBM Plex Mono"';x.fillText(caption,bpx,ph+bpx+cap*.62)}
  const h=w*c.height/c.width,geo=new THREE.PlaneGeometry(w,h,24,24),p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const u=p.getX(i)/w*2,v=p.getY(i)/h*2;p.setZ(i,curl*(u*u*.6+v*v*.25+Math.max(0,u*v)*.3))}
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex(c),roughness:.42,side:THREE.DoubleSide}));
  m.castShadow=true;m.receiveShadow=true;return m;
}
// a flat sticker/type panel lying on the surface; its alpha casts a real shadow
function panel(c,w,lift=.2){
  const h=w*c.height/c.width,t=tex(c);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,transparent:true,alphaTest:.5,roughness:.55}));
  m.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:t,alphaTest:.5});
  m.castShadow=true;m.receiveShadow=true;m.rotation.x=-Math.PI/2;m.position.y=lift;return m;
}
// the surface: black tiles, grout glowing faintly in the accent (the site's grid floor, seen from above)
function floor(acc,size=60,tiles=1.15){
  const px=2048,c=mk(px,px),x=c.getContext('2d');x.fillStyle='#050507';x.fillRect(0,0,px,px);
  const n=Math.round(size/tiles),s=px/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=4+hash(i,j)*6;x.fillStyle=`rgb(${v},${v},${v+3})`;x.fillRect(i*s+2,j*s+2,s-4,s-4)}
  x.strokeStyle=acc;x.globalAlpha=.32;x.lineWidth=3;for(let i=0;i<=n;i++){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,px);x.stroke();x.beginPath();x.moveTo(0,i*s);x.lineTo(px,i*s);x.stroke()}
  const t=tex(c);t.anisotropy=16;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshStandardMaterial({map:t,roughness:.92,metalness:0}));
  m.rotation.x=-Math.PI/2;m.receiveShadow=true;return m;
}
function lights(acc,opt={}){
  SCN.add(new THREE.HemisphereLight('#ffffff','#15161c',opt.hemi??.32));
  const key=new THREE.DirectionalLight('#ffffff',opt.key??1.55);key.position.set(-4,22,4);key.castShadow=true;
  key.shadow.mapSize.set(4096,4096);const sc=key.shadow.camera;sc.left=-16;sc.right=16;sc.top=16;sc.bottom=-16;sc.near=1;sc.far=60;key.shadow.radius=6;key.shadow.bias=-.0006;
  SCN.add(key);
  const pool=new THREE.PointLight(acc,opt.pool??3.2,20,2);pool.position.set(opt.px??3,4,opt.pz??-5);SCN.add(pool);
  const rim=new THREE.DirectionalLight(PAL.cyan,.25);rim.position.set(9,6,-6);SCN.add(rim);
}
function topCam(w,h,dist=34,tilt=5){CAM=new THREE.PerspectiveCamera(28,w/h,.5,200);CAM.position.set(0,dist,tilt);CAM.lookAt(0,0,0);return CAM}

// ============================================================ POSTS (1080 x 1350)
const PW=1080,PH=1350;
function finishPost(cv,acc,tag){
  const o=mk(PW,PH),x=o.getContext('2d');x.drawImage(cv,0,0);
  // corner mark + series tag (sit on the frame, not in the world)
  splitText(x,'JATIN',118,64,44,-.06,2);
  if(tag){x.font='600 22px "IBM Plex Mono"';x.fillStyle='#fff';x.textAlign='right';x.fillText(tag,PW-40,70);x.textAlign='left'}
  grain(x,PW,PH,9);return o;
}
const DRAFTS={};
DRAFTS.p1=async()=>{ // STOP EDITING SAFE
  const acc=PAL.pink;const cv=initGL(PW,PH,'#000');topCam(PW,PH);lights(acc,{px:4,pz:-3});
  SCN.add(floor(acc));
  const A=await loadImg('../../site/work/flux-02/20.jpg');
  const pr=print(A,6.2,.05,.35);pr.rotation.set(-Math.PI/2,0,.16);pr.position.set(2.1,.12,4.4);SCN.add(pr);
  const T=paintType(2048,2560,[
    {t:'STOP',size:.3,x:.46,y:.15,rot:-.07,seed:3},
    {t:'editing',style:'mono',size:.09,x:.7,y:.285,rot:-.06,seed:5},
    {t:'SAFE',size:.31,x:.5,y:.42,rot:.04,seed:9}
  ]);
  SCN.add(panel(T,12.6,.32));
  // banner
  const b=mk(1600,190),bx=b.getContext('2d');plate(bx,10,10,1560,150,0,PAL.pink,'do this instead..','italic 700 84px "IBM Plex Mono"','#000');
  const bp=panel(b,7.2,.5);bp.rotation.z=.07;bp.position.set(2.4,1.25,.2);SCN.add(bp);
  // the chain snapping across the print: one link broken, halves flung up and casting shadows
  const ch=voxelChain(9,RAMP.acid,.15,{broken:4,lo:1.2,hi:3.3});ch.position.set(-1.6,.9,2.6);ch.rotation.set(0,.42,0);SCN.add(ch);
  const ch2=voxelChain(5,RAMP.acid,.15);ch2.position.set(4.9,1.6,5.8);ch2.rotation.set(.5,.42,.35);SCN.add(ch2);

function star(x,cx,cy,r,col){x.save();x.translate(cx,cy);x.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.42:r,a=-Math.PI/2+i*Math.PI/5;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.save();x.translate(r*.12,r*.12);x.fillStyle='#000';x.fill();x.restore();x.fillStyle=col;x.fill();x.fillStyle=dotPattern(x,6,.5);x.fill();x.lineWidth=r*.12;x.strokeStyle='#000';x.stroke();x.restore()}
function ransom(x,t,cx,cy,size,seed){ // mixed faces, jostled, a few letters on paper chips
  const fonts=['"Cyberway Riders"','"VT323"','italic 700 "IBM Plex Mono"'];let items=[],tw=0;

  let px=cx-tw/2;items.forEach((it,i)=>{x.save();x.translate(px+it.w/2,cy+(hash(seed,i+200)-.5)*size*.12);x.rotate((hash(seed,i+300)-.5)*.2);x.font=(it.f===2?'italic 700 ':'')+it.s+'px '+fonts[it.f].replace('italic 700 ','');x.textAlign='center';x.textBaseline='middle';
    const chip=it.ch!==' '&&hash(seed,i+400)<.22;

    else{x.fillStyle='#000';x.fillText(it.ch,4,5);x.fillStyle=PAL.pink;x.fillText(it.ch,-3,0);x.fillStyle=PAL.cyan;x.fillText(it.ch,3,0);x.fillStyle='#fff';x.fillText(it.ch,0,0)}

}
function slices(x,w,h,seed){for(let i=0;i<5;i++){const y=hash(seed,i)*h,hh=10+hash(seed,i+9)*40,o=(hash(seed,i+19)-.5)*70;x.drawImage(x.canvas,0,y,w,hh,o,y,w,hh)}}
